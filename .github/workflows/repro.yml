name: strptime reproducers
on:
  push:
  workflow_dispatch:
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install nightly pyarrow (main)
        run: "python -m pip install --pre --only-binary=:all: --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple pyarrow"
      - name: Run reproducers
        run: python repro.py
      - name: Issue 1
        run: python issue1.py
      - name: Issue 2
        run: python issue2.py
      - name: Issue 2 ISO
        run: python issue2-iso.py
        continue-on-error: true
